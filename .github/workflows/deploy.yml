name: Trigger Vercel Deploy

# The Vercel project was imported via its public URL rather than through
# Vercel's GitHub App, so no webhook was ever installed on this repo and
# pushes to main never triggered a build. This calls the Vercel Deploy
# Hook (Settings -> Git -> Deploy Hooks in the Vercel dashboard) as a
# stand-in until that connection is fixed properly.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # VERCEL_DEPLOY_HOOK_URL lives under the "production" Environment's
    # secrets (not plain repository secrets) — a job only gets access to an
    # environment's secrets if it explicitly targets that environment.
    environment: production
    steps:
      - name: Call Vercel deploy hook
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret is empty or not set — check Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "Secret is set, length: ${#HOOK_URL} chars"
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" -X POST "$HOOK_URL")
          echo "Response body: $(cat /tmp/response.json)"
          echo "HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Deploy hook returned non-2xx status $status"
            exit 1
          fi
